services:
  db:
    build: docker/postgres
    environment:
      POSTGRES_USER: haussmann
      POSTGRES_PASSWORD: haussmann
      POSTGRES_DB: haussmann
    ports:
      - "127.0.0.1:${HAUSSMANN_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haussmann -d haussmann"]
      interval: 2s
      timeout: 3s
      retries: 30

  traces:
    image: jaegertracing/jaeger:2.23.0
    profiles: ["traces"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  db-data:
