[project]
name = "haussmann"
version = "0.1.0"
description = "Evidence-first deliverable engine."
readme = "PROJECT.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["feasibility_fr", "pyright>=1.1.390", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haussmann"]

[tool.uv.workspace]
members = ["workloads/*"]

[tool.uv.sources]
feasibility_fr = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "workloads"]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not live"]
markers = ["live: calls a real model provider; never selected by default or in CI"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "workloads/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "workloads"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
