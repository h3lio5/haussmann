[project]
name = "haussmann"
version = "0.1.0"
description = "Evidence-first deliverable engine."
readme = "PROJECT.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "opentelemetry-api>=1.45",
    "psycopg[binary]>=3.3",
    "pydantic>=2.9",
    "pypdf>=5",
]

[project.optional-dependencies]
generate = [
    "pillow>=11",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "feasibility_fr",
    "haussmann[generate]",
    "hypothesis>=6",
    "import-linter>=2.1",
    "opentelemetry-sdk>=1.45",
    "pyright>=1.1.390",
    "pytest>=8",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
    "types-reportlab>=5.1.0.20261104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haussmann"]

[tool.uv.workspace]
members = ["workloads/*"]

[tool.uv.sources]
feasibility_fr = { workspace = true }
haussmann = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "workloads"]
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not live"]
markers = [
    "live: calls a real model provider; never selected by default or in CI",
    "db: needs Postgres; runs when HAUSSMANN_DB_URL is set",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "workloads/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "workloads"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.importlinter]
root_packages = ["haussmann", "feasibility_fr"]

[[tool.importlinter.contracts]]
name = "Platform layers"
type = "layers"
containers = ["haussmann"]
layers = [
    "review",
    "buildkit | evalkit",
    "ctxkit | flow | verify",
    "llmkit | docparse | ledger",
    "coretypes",
]

[[tool.importlinter.contracts]]
name = "Platform never imports a workload"
type = "forbidden"
source_modules = ["haussmann"]
forbidden_modules = ["feasibility_fr"]

[[tool.importlinter.contracts]]
name = "The workload's run path never imports its benchmark"
type = "forbidden"
source_modules = ["feasibility_fr.engine"]
forbidden_modules = ["feasibility_fr.benchmark"]

