[project]
name = "haussmann"
version = "0.1.0"
description = "Evidence-first deliverable engine."
readme = "PROJECT.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "feasibility_fr"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haussmann"]

[tool.uv.workspace]
members = ["workloads/*"]

[tool.uv.sources]
feasibility_fr = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "workloads"]
addopts = ["--import-mode=importlib"]
