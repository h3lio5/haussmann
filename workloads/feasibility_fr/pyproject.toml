[project]
name = "feasibility_fr"
version = "0.1.0"
description = "Feasibility memo workload for French real-estate sites."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "haussmann[generate]",
    "uvicorn>=0.32",
]

[tool.uv.sources]
haussmann = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feasibility_fr"]
